<svg xmlns="http://www.w3.org/2000/svg" width="500" height="376" viewBox="0 0 500 376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1917"/><stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>
  <rect width="500" height="376" rx="12" fill="url(#dbg)"/>
  <rect x="0.5" y="0.5" width="499" height="375" rx="12" fill="none" stroke="#44403c"/>
  <line x1="0" y1="30" x2="500" y2="30" stroke="#44403c"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="34" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="15" r="5" fill="#27c93f"/>
  <text x="250.0" y="19.5" fill="#a8a29e" font-size="11.5" text-anchor="middle">navneet@lab: ~$ casefile --brief</text>

  <text x="22" y="56" font-size="14" font-weight="700">
    <tspan fill="#f59e0b">navneet</tspan><tspan fill="#a8a29e">@</tspan><tspan fill="#2dd4bf">lab</tspan>
  </text>
  <line x1="150" y1="52" x2="478" y2="52" stroke="#44403c" stroke-opacity="0.8"/>

  <g opacity="0" transform="translate(0,5)">
  <text x="22" y="78" fill="#f59e0b" font-size="12.5" font-weight="700">Now</text>
  <text x="118" y="78" fill="#fafaf9" font-size="12.5">Timelines, and a voice agent</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.12s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.12s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
</g><g opacity="0" transform="translate(0,5)">
  <text x="22" y="104" fill="#f59e0b" font-size="12.5" font-weight="700">With</text>
  <text x="118" y="104" fill="#fafaf9" font-size="12.5">A team. The repos are not all mine.</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.18s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.18s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
</g><g opacity="0">
  <text x="22" y="146" fill="#2dd4bf" font-size="12.5" font-weight="700">— Open</text>
  <line x1="78" y1="142" x2="478" y2="142" stroke="#44403c" stroke-opacity="0.85"/>
  <animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.35s" fill="freeze"/>
</g><g opacity="0" transform="translate(0,5)">
  <text x="22" y="172" fill="#f59e0b" font-size="12.5" font-weight="700">jarv1s</text>
  <text x="118" y="172" fill="#fafaf9" font-size="12.5">Voice on the machine. Shared.</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.30s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
</g><g opacity="0" transform="translate(0,5)">
  <text x="22" y="198" fill="#f59e0b" font-size="12.5" font-weight="700">fuseline</text>
  <text x="118" y="198" fill="#fafaf9" font-size="12.5">Phone artifacts, one clock.</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.36s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.36s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
</g><g opacity="0">
  <text x="22" y="236" fill="#2dd4bf" font-size="12.5" font-weight="700">— Closed</text>
  <line x1="78" y1="232" x2="478" y2="232" stroke="#44403c" stroke-opacity="0.85"/>
  <animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.35s" fill="freeze"/>
</g><g opacity="0" transform="translate(0,5)">
  <text x="22" y="262" fill="#f59e0b" font-size="12.5" font-weight="700">Pramaan</text>
  <text x="118" y="262" fill="#fafaf9" font-size="12.5">DVR evidence. Door is shut.</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.48s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.48s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
</g><g opacity="0" transform="translate(0,5)">
  <text x="22" y="288" fill="#f59e0b" font-size="12.5" font-weight="700">m1rage</text>
  <text x="118" y="288" fill="#fafaf9" font-size="12.5">CTF locker. No public link.</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.54s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.54s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
</g><g opacity="0" transform="translate(0,5)">
  <text x="22" y="314" fill="#f59e0b" font-size="12.5" font-weight="700">Amazon</text>
  <text x="118" y="314" fill="#fafaf9" font-size="12.5">Entity resolution. Also shut.</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.60s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
</g><text x="22" y="352" fill="#a8a29e" font-size="12">navneet@lab:~$</text>
<rect x="128" y="340" width="8" height="14" fill="#f59e0b">
  <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
</svg>
