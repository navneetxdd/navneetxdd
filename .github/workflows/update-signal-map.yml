name: update signal map

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-signal-map.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install -r scripts/requirements.txt

      - name: fetch contributions
        env:
          GH_PROFILE_USER: navneetxdd
        run: python scripts/fetch_contributions.py

      - name: render art
        run: |
          python scripts/make_case_board.py
          python scripts/make_dossier.py
          python scripts/render_signal_map.py

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json case-board.svg dossier.svg signal-map.svg
          git diff --cached --quiet || git commit -m "chore: refresh lab signal map"
          git push
